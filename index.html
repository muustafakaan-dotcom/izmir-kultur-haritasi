<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#efeae2" />
    <title>İzmir · Kültür Haritası</title>
    <meta name="description" content="İzmir’de tiyatro, konser, stand-up, sergi; müzeler ve ören yerleri tek haritada. Geri sayım ve hatırlatma." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body data-tab="kesfet">
    <div id="map"></div>

    <header class="brand">
      <span class="brand__city">İzmir</span>
      <span class="brand__sub">kültür haritası</span>
    </header>

    <aside class="panel" id="panel">
      <button class="panel__handle" id="handle" aria-label="Paneli aç/kapat"></button>

      <nav class="tabs" id="tabs">
        <button class="tab is-on" data-tab="kesfet">Keşfet</button>
        <button class="tab" data-tab="takvim">Takvimim <b class="tab__n" id="takvimCount" hidden></b></button>
      </nav>

      <section class="view" id="listView">
        <div class="filters">
          <label class="search">
            <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg>
            <input id="q" type="search" placeholder="Oyun, sanatçı, mekan ara…" autocomplete="off" />
          </label>
          <div class="segs" id="dates"></div>
          <nav class="chips" id="cats" aria-label="Kategori"></nav>
        </div>
        <p class="count" id="count"></p>
        <ul class="list" id="list"></ul>
        <p class="updated" id="updated"></p>
      </section>

      <section class="view view--card" id="cardView" hidden></section>
    </aside>

    <div class="tools">
      <button class="tool" id="tilt" title="2B / 3B">3B</button>
      <button class="tool" id="home" title="Merkeze dön">
        <svg viewBox="0 0 24 24"><path d="M12 3v3M12 18v3M3 12h3M18 12h3"/><circle cx="12" cy="12" r="4"/></svg>
      </button>
    </div>

    <div class="sheet" id="sheet" hidden></div>
    <div class="toast" id="toast" role="status"></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
